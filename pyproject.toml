[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scowbox"
version = "0.1.0"
description = "Maintenance dredging measurement and payment: surveys, scow box measure, pay quantities"
requires-python = ">=3.12"
dependencies = ["click==8.1.8"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.6.10",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[project.scripts]
scowbox = "scowbox.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/scowbox"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "N", "PT",
  "A", "BLE", "C90", "DTZ", "ISC", "PIE", "RSE", "RUF", "TID",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/scowbox"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
